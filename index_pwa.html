async function apiGet() {
  const r = await fetch(WEB_APP_URL);
  if (!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
async function apiPost(payload) {
  const params = encodeURIComponent(JSON.stringify(payload));
  const r = await fetch(WEB_APP_URL + "?payload=" + params);
  if (!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}

const hoy = new Date(); hoy.setHours(0,0,0,0);
function parseDate(s) { if(!s) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function fmtCorto(s) { const d=parseDate(s); if(!d) return ""; return d.toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"}); }
function fmtMes(s) { const d=parseDate(s); if(!d) return ""; return d.toLocaleDateString("es-ES",{month:"long",year:"numeric"}); }
function diasHasta(s) { const d=parseDate(s); if(!d) return 999; return Math.ceil((d-hoy)/86400000); }
function esSemana(s) {
  const d=parseDate(s); if(!d) return false;
  const lun=new Date(hoy); lun.setDate(hoy.getDate()-((hoy.getDay()+6)%7));
  const dom=new Date(lun); dom.setDate(lun.getDate()+6); dom.setHours(23,59,59);
  return d>=lun && d<=dom;
}
function colorCortador(n) {
  if(!n) return "#9e9e9e";
  const map={Jorge:"#c0392b",Pablo:"#8b4513",Iván:"#d4a820",Álvaro:"#2c5f2e",Borja:"#1a3a5c",Manuel:"#6d2b8f",Carlos:"#e67e22",Javier:"#16a085",Juan:"#8e44ad",Martín:"#795548",Demetrio:"#607d8b",Enrique:"#e91e63",Adrián:"#c0392b",David:"#2980b9",Miguel:"#27ae60",Karen:"#e91e63",Marcos:"#16a085",Emilio:"#8b4513"};
  const k=Object.keys(map).find(k=>n.toLowerCase().includes(k.toLowerCase()));
  return k?map[k]:"#8b7355";
}

const inp = {width:"100%",background:"#1e1e1e",border:"1px solid #333",borderRadius:10,padding:"10px 14px",color:"#f0e6d0",fontSize:14,outline:"none",boxSizing:"border-box",fontFamily:"inherit"};
const lbl = {color:"#888",fontSize:11,letterSpacing:"0.08em",marginBottom:5,display:"block",textTransform:"uppercase"};

function Badge({text,color,small=false}) {
  const c=ESTADO_C[text]||{bg:(color||"#888")+"22",text:color||"#888",dot:color||"#888"};
  return <span style={{background:c.bg,color:c.text,borderRadius:20,padding:small?"1px 8px":"2px 10px",fontSize:small?10:11,fontWeight:700,letterSpacing:"0.04em",display:"inline-flex",alignItems:"center",gap:5}}>
    <span style={{width:5,height:5,borderRadius:"50%",background:c.dot,display:"inline-block"}}/>
    {text.toUpperCase()}
  </span>;
}
function Spinner() {
  return <div style={{display:"flex",justifyContent:"center",padding:"60px 0"}}>
    <div style={{width:32,height:32,borderRadius:"50%",border:"3px solid #2a2a2a",borderTopColor:"#c9a96e",animation:"spin 0.8s linear infinite"}}/>
  </div>;
}
function IconBtn({onClick,children,style={}}) {
  return <button onClick={onClick} style={{background:"none",border:"none",cursor:"pointer",padding:8,borderRadius:8,color:"#c9a96e",display:"flex",alignItems:"center",justifyContent:"center",...style}}>{children}</button>;
}

function EventoCard({ev,onClick,onQuickEdit}) {
  const dias=diasHasta(ev.fecha);
  const urgente=dias>=0&&dias<=3;
  const col=colorCortador(ev.cortador);
  return <div style={{background:urgente?"#1e1408":"#141414",border:`1px solid ${urgente?"#c9a96e44":"#2a2a2a"}`,borderLeft:`3px solid ${col}`,borderRadius:12,padding:"12px 14px",marginBottom:8,position:"relative",overflow:"hidden"}}>
    {urgente&&<div style={{position:"absolute",top:0,left:0,right:0,height:2,background:"linear-gradient(90deg,#c9a96e,#e8c98a,#c9a96e)"}}/>}
    <div onClick={()=>onClick(ev)} style={{cursor:"pointer"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
        <div style={{flex:1,paddingRight:8}}>
          <div style={{color:"#f0e6d0",fontFamily:"'Playfair Display',serif",fontSize:15,fontWeight:600,marginBottom:2}}>{ev.cliente}</div>
          <div style={{color:"#888",fontSize:11}}>{ev.tipo}</div>
        </div>
        <Badge text={ev.estado} small/>
      </div>
      <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
        <span style={{color:"#c9a96e",fontSize:12,fontWeight:600}}>{fmtCorto(ev.fecha)}</span>
        <span style={{color:"#555",fontSize:11}}>·</span>
        <span style={{color:"#aaa",fontSize:11}}>{ev.turno}</span>
        {ev.cortador
          ? <><span style={{color:"#555",fontSize:11}}>·</span><span style={{color:"#aaa",fontSize:11}}>✂ {ev.cortador}</span></>
          : <><span style={{color:"#555",fontSize:11}}>·</span><span style={{color:"#f87171",fontSize:11,fontWeight:600}}>Sin cortador</span></>
        }
        {ev.jamones>0&&<><span style={{color:"#555",fontSize:11}}>·</span><span style={{color:"#aaa",fontSize:11,display:"inline-flex",alignItems:"center",gap:3}}><img src={JAMON_ICON} style={{width:13,height:13,objectFit:"contain"}}/>{ev.jamones}</span></>}
      </div>
      {dias>=0&&dias<=7&&<div style={{marginTop:5,color:dias<=1?"#f87171":dias<=3?"#fbbf24":"#888",fontSize:11,fontWeight:600}}>{dias===0?"⚡ HOY":dias===1?"⚡ MAÑANA":`En ${dias} días`}</div>}
    </div>
    <div style={{display:"flex",gap:6,marginTop:8,paddingTop:8,borderTop:"1px solid #1e1e1e"}}>
      <button onClick={e=>{e.stopPropagation();onQuickEdit(ev,"estado");}} style={{flex:1,background:"#1a1a1a",border:"1px solid #2a2a2a",borderRadius:7,padding:"5px 0",color:"#aaa",cursor:"pointer",fontSize:11,fontFamily:"inherit"}}>Estado</button>
      <button onClick={e=>{e.stopPropagation();onQuickEdit(ev,"cortador");}} style={{flex:1,background:"#1a1a1a",border:"1px solid #2a2a2a",borderRadius:7,padding:"5px 0",color:"#aaa",cursor:"pointer",fontSize:11,fontFamily:"inherit"}}>Cortador</button>
      <button onClick={e=>{e.stopPropagation();onClick(ev);}} style={{flex:1,background:"#c9a96e18",border:"1px solid #c9a96e44",borderRadius:7,padding:"5px 0",color:"#c9a96e",cursor:"pointer",fontSize:11,fontFamily:"inherit"}}>Editar</button>
    </div>
  </div>;
}

function PanelRapido({ev,campo,cortadores,onClose,onSaved}) {
  const [val,setVal]=useState(campo==="estado"?ev.estado:(ev.cortador||""));
  const [saving,setSaving]=useState(false);
  const [err,setErr]=useState("");
  async function guardar() {
    setSaving(true); setErr("");
    try {
      const datos=campo==="estado"?{estado:val}:{cortador:val};
      const res=await apiPost({accion:"editar",num:ev.num,datos});
      if(res.ok) onSaved({...ev,...datos}); else setErr(res.msg||"Error");
    } catch(e) { setErr("Error de conexión"); }
    setSaving(false);
  }
  return <div onClick={onClose} style={{position:"fixed",inset:0,zIndex:300,background:"rgba(0,0,0,0.75)",display:"flex",flexDirection:"column",justifyContent:"flex-end"}}>
    <div onClick={e=>e.stopPropagation()} style={{background:"#141414",borderRadius:"18px 18px 0 0",padding:"18px 18px 28px",borderTop:"2px solid #c9a96e",animation:"slideUp 0.25s ease"}}>
      <div style={{width:36,height:3,background:"#333",borderRadius:2,margin:"0 auto 14px"}}/>
      <div style={{color:"#f0e6d0",fontFamily:"'Playfair Display',serif",fontSize:15,fontWeight:600,marginBottom:3}}>{ev.cliente}</div>
      <div style={{color:"#888",fontSize:11,marginBottom:14}}>Cambiar {campo==="estado"?"estado":"cortador"}</div>
      {campo==="estado"
        ? <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:14}}>
            {ESTADOS.map(s=><button key={s} onClick={()=>setVal(s)} style={{background:val===s?"#c9a96e18":"#1a1a1a",border:`1px solid ${val===s?"#c9a96e":"#2a2a2a"}`,borderRadius:9,padding:"9px 6px",color:val===s?"#c9a96e":"#aaa",cursor:"pointer",fontSize:11,fontFamily:"inherit"}}>{s}</button>)}
          </div>
        : <div style={{marginBottom:14}}>
            <select value={val} onChange={e=>setVal(e.target.value)} style={{...inp,appearance:"none"}}>
              <option value="">— Sin asignar —</option>
              {cortadores.map(c=><option key={c.nombre} value={c.nombre}>{c.nombre}</option>)}
            </select>
          </div>
      }
      {err&&<div style={{color:"#f87171",fontSize:12,marginBottom:8}}>⚠️ {err}</div>}
      <button onClick={guardar} disabled={saving} style={{width:"100%",background:saving?"#2a2a1a":"linear-gradient(135deg,#c9a96e,#a07840)",border:"none",borderRadius:11,padding:"12px",color:saving?"#888":"#1a0f00",fontWeight:700,fontSize:14,cursor:saving?"default":"pointer",fontFamily:"inherit"}}>
        {saving?"Guardando…":"💾 Guardar"}
      </button>
    </div>
  </div>;
}

function FormEvento({ev,cortadores,clientes=[],onBack,onSaved,onDeleted,isNew=false,onCreate}) {
  const def = ev || {fecha:"",turno:"Mediodía",cliente:"",tipo:"Boda",cortador:"",jamones:1,estado:"Pendiente",obs:""};
  const [form,setForm]=useState({...def});
  const [dirty,setDirty]=useState(isNew);
  const [saving,setSaving]=useState(false);
  const [confirmDel,setConfirmDel]=useState(false);
  const [err,setErr]=useState("");
  function set(k,v) { setForm(f=>({...f,[k]:v})); setDirty(true); setErr(""); }

  async function guardar() {
    if(isNew) {
      if(!form.fecha){setErr("La fecha es obligatoria");return;}
      if(!form.cliente.trim()){setErr("El cliente es obligatorio");return;}
      setSaving(true); setErr("");
      try {
        const res=await apiPost({accion:"crear",datos:{fecha:form.fecha,turno:form.turno,cliente:form.cliente,tipo:form.tipo,cortadores:form.cortador?[form.cortador]:[],jamones:form.jamones,estado:form.estado,descripcion:form.obs||"",nuevoCliente:form.nuevoCliente||false}});
        if(res.ok) onCreate(res); else setErr(res.msg||"Error");
      } catch(e){setErr("Error de conexión");}
      setSaving(false);
    } else {
      setSaving(true); setErr("");
      try {
        const res=await apiPost({accion:"editar",num:ev.num,datos:{fecha:form.fecha,turno:form.turno,cliente:form.cliente,tipo:form.tipo,cortador:form.cortador,jamones:form.jamones,estado:form.estado,descripcion:form.obs}});
        if(res.ok){setDirty(false);onSaved(form);} else setErr(res.msg||"Error");
      } catch(e){setErr("Error de conexión");}
      setSaving(false);
    }
  }

  async function cancelarEvento() {
    setSaving(true);
    try {
      const res=await apiPost({accion:"estado",num:ev.num,estado:"Cancelado"});
      if(res.ok) onDeleted(ev.num); else setErr(res.msg);
    } catch(e){setErr("Error");}
    setSaving(false);
  }

  const titulo=isNew?"Nuevo evento":ev.cliente;
  const subtitulo=isNew?"":`${fmtCorto(ev.fecha)} · ${ev.turno}`;
  const btnLabel=saving?"Guardando en Sheet…":isNew?"✅ Crear evento":dirty?"💾 Guardar cambios":"Sin cambios";
  const btnActive=(isNew||dirty)&&!saving;

  return <div style={{height:"100%",display:"flex",flexDirection:"column"}}>
    <div style={{display:"flex",alignItems:"center",gap:12,padding:"14px 16px",borderBottom:"1px solid #1e1e1e",flexShrink:0}}>
      <IconBtn onClick={onBack}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></IconBtn>
      <div style={{flex:1}}>
        <div style={{color:"#f0e6d0",fontFamily:"'Playfair Display',serif",fontSize:17,fontWeight:600}}>{titulo}</div>
        {subtitulo&&<div style={{color:"#888",fontSize:11}}>{subtitulo}</div>}
      </div>
      {!isNew&&<Badge text={form.estado}/>}
    </div>
    <div style={{flex:1,overflowY:"auto",padding:"16px"}}>
      <div style={{display:"grid",gap:13}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <div><label style={lbl}>Fecha{isNew?" *":""}</label><input type="date" value={form.fecha} onChange={e=>set("fecha",e.target.value)} style={inp} onFocus={e=>e.target.style.borderColor="#c9a96e"} onBlur={e=>e.target.style.borderColor="#333"}/></div>
          <div><label style={lbl}>Turno</label><input type="text" value={form.turno||""} onChange={e=>set("turno",e.target.value)} style={inp} onFocus={e=>e.target.style.borderColor="#c9a96e"} onBlur={e=>e.target.style.borderColor="#333"}/></div>
        </div>
        <div>
          <label style={lbl}>Cliente{isNew?" *":""}</label>
          <input
            type="text"
            list="lista-clientes"
            value={form.cliente||""}
            onChange={e=>{set("cliente",e.target.value);set("nuevoCliente",false);}}
            placeholder="Nombre del cliente…"
            style={inp}
            onFocus={e=>e.target.style.borderColor="#c9a96e"}
            onBlur={e=>e.target.style.borderColor="#333"}
          />
          <datalist id="lista-clientes">
            {clientes.map((c,i)=><option key={i} value={c}/>)}
          </datalist>
          {form.cliente && clientes.length > 0 && !form.nuevoCliente &&
           !clientes.some(c=>c.toLowerCase()===form.cliente.toLowerCase().trim()) &&
           form.cliente.trim().length > 2 && (
            <div
              onClick={()=>set("nuevoCliente",true)}
              style={{marginTop:6,background:"#1a3a1a",border:"1px solid #4ade8044",borderRadius:8,padding:"8px 12px",cursor:"pointer",fontSize:12,color:"#4ade80",display:"flex",alignItems:"center",gap:6}}
            >
              <span style={{fontSize:14}}>➕</span>
              Crear nuevo cliente: <strong>{form.cliente}</strong>
            </div>
          )}
          {form.nuevoCliente && (
            <div style={{marginTop:4,fontSize:11,color:"#4ade80"}}>✅ Se añadirá a la hoja Clientes</div>

        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <div><label style={lbl}>Tipo</label><select value={form.tipo||""} onChange={e=>set("tipo",e.target.value)} style={{...inp,appearance:"none"}}>{TIPOS.map(t=><option key={t} value={t}>{t}</option>)}</select></div>
          <div><label style={lbl}>Estado</label><select value={form.estado||""} onChange={e=>set("estado",e.target.value)} style={{...inp,appearance:"none"}}>{ESTADOS.map(s=><option key={s} value={s}>{s}</option>)}</select></div>
        </div>
        <div><label style={lbl}>Cortador</label>
          <select value={form.cortador||""} onChange={e=>set("cortador",e.target.value)} style={{...inp,appearance:"none"}}>
            <option value="">— Sin asignar —</option>
            {cortadores.map(c=><option key={c.nombre} value={c.nombre}>{c.nombre}</option>)}
          </select>
        </div>

                  <button onClick={cancelarEvento} disabled={saving} style={{flex:1,background:"#7f1d1d",border:"none",color:"#fca5a5",borderRadius:7,padding:"7px",cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"inherit"}}>Sí, cancelar</button>
                </div>
              </div>

        </div>}

    </div>
    <div style={{padding:"10px 16px 10px",borderTop:"1px solid #1e1e1e",flexShrink:0,background:"#0e0e0e",position:"sticky",bottom:0,zIndex:10}}>
      <button onClick={guardar} disabled={!btnActive} style={{width:"100%",background:btnActive?"linear-gradient(135deg,#c9a96e,#a07840)":"#2a2a2a",border:"none",borderRadius:11,padding:"13px",color:btnActive?"#1a0f00":"#555",fontWeight:700,fontSize:14,cursor:btnActive?"pointer":"default",fontFamily:"inherit"}}>
        {btnLabel}
      </button>
    </div>
  </div>;
}

function TabEventos({eventos,onEventoClick,onQuickEdit,loading}) {
  const [filtro,setFiltro]=useState("todos");
  const [busqueda,setBusqueda]=useState("");
  if(loading) return <Spinner/>;
  const filtered=eventos
    .filter(e=>{
      if(filtro==="sinCortador") return !e.cortador&&diasHasta(e.fecha)>=0;
      if(filtro==="semana") return esSemana(e.fecha);
      return true;
    })
    .filter(e=>!busqueda||e.cliente.toLowerCase().includes(busqueda.toLowerCase()))
    .sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const grupos={};
  filtered.forEach(e=>{const m=fmtMes(e.fecha);if(!grupos[m])grupos[m]=[];grupos[m].push(e);});
  return <div style={{padding:"0 16px 100px"}}>
    <div style={{position:"relative",marginBottom:12}}>
      <input type="text" placeholder="Buscar cliente…" value={busqueda} onChange={e=>setBusqueda(e.target.value)} style={{width:"100%",background:"#1e1e1e",border:"1px solid #2a2a2a",borderRadius:11,padding:"10px 14px 10px 36px",color:"#f0e6d0",fontSize:13,outline:"none",boxSizing:"border-box",fontFamily:"inherit"}}/>
      <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:"#555"}}>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </span>
    </div>
    <div style={{display:"flex",gap:6,marginBottom:14,overflowX:"auto",paddingBottom:4}}>
      {[["todos","Todos"],["semana","Semana"],["sinCortador","Sin cortador"]].map(([k,l])=><button key={k} onClick={()=>setFiltro(k)} style={{flexShrink:0,background:filtro===k?"#c9a96e":"#1e1e1e",border:`1px solid ${filtro===k?"#c9a96e":"#2a2a2a"}`,color:filtro===k?"#1a0f00":"#888",borderRadius:20,padding:"5px 12px",cursor:"pointer",fontSize:11,fontWeight:filtro===k?700:400,fontFamily:"inherit"}}>{l}</button>)}
    </div>
    {Object.entries(grupos).map(([mes,evs])=><div key={mes}>
      <div style={{color:"#555",fontSize:10,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:8,paddingLeft:2}}>{mes}</div>
      {evs.map(ev=><EventoCard key={ev.num} ev={ev} onClick={onEventoClick} onQuickEdit={onQuickEdit}/>)}
    </div>)}
    {filtered.length===0&&<div style={{color:"#555",textAlign:"center",padding:"40px 0",fontSize:13}}>No hay eventos con este filtro</div>}
    <div style={{marginTop:8,fontSize:10,color:"#444"}}>{filtered.length} evento{filtered.length!==1?"s":""} · {eventos.length} en total</div>
  </div>;
}

function TabCalendario({eventos,onEventoClick,onQuickEdit,loading}) {
  const [mes,setMes]=useState(new Date().getMonth());
  const [año,setAño]=useState(new Date().getFullYear());
  const [diaSelec,setDiaSelec]=useState(null);
  if(loading) return <Spinner/>;
  const offset=(new Date(año,mes,1).getDay()+6)%7;
  const dias=new Date(año,mes+1,0).getDate();
  const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const evMes={};
  eventos.forEach(e=>{
    const d=parseDate(e.fecha);
    if(d&&d.getMonth()===mes&&d.getFullYear()===año){
      const k=d.getDate(); if(!evMes[k])evMes[k]=[]; evMes[k].push(e);
    }
  });
  const cambiarMes=delta=>{
    let nm=mes+delta,na=año;
    if(nm<0){nm=11;na--;}if(nm>11){nm=0;na++;}
    setMes(nm);setAño(na);setDiaSelec(null);
  };
  const hoyD=new Date().getDate(),hoyM=new Date().getMonth(),hoyA=new Date().getFullYear();
  const dKey=d=>`${año}-${String(mes+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const evsDia=diaSelec?eventos.filter(e=>e.fecha===diaSelec).sort((a,b)=>(a.turno||"").localeCompare(b.turno||"")):[];
  return <div style={{padding:"0 16px 100px"}}>
    <div style={{background:"#141414",border:"1px solid #2a2a2a",borderRadius:14,padding:"14px",marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <button onClick={()=>cambiarMes(-1)} style={{background:"none",border:"none",color:"#888",cursor:"pointer",fontSize:22,padding:"0 8px",lineHeight:1}}>‹</button>
        <span style={{fontFamily:"'Playfair Display',serif",fontSize:15,fontWeight:700,color:"#f0e6d0"}}>{MESES[mes]} {año}</span>
        <button onClick={()=>cambiarMes(1)} style={{background:"none",border:"none",color:"#888",cursor:"pointer",fontSize:22,padding:"0 8px",lineHeight:1}}>›</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:4}}>
        {["L","M","X","J","V","S","D"].map(d=><div key={d} style={{textAlign:"center",fontSize:9,color:"#444",letterSpacing:1}}>{d}</div>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
        {Array(offset).fill(null).map((_,i)=><div key={`e${i}`}/>)}
        {Array(dias).fill(null).map((_,i)=>{
          const d=i+1,evs=evMes[d]||[],esHoy=d===hoyD&&mes===hoyM&&año===hoyA;
          const key=dKey(d),sel=diaSelec===key,col=evs.length?colorCortador(evs[0].cortador):null;
          return <div key={d} onClick={()=>evs.length&&setDiaSelec(sel?null:key)} style={{aspectRatio:"1",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",borderRadius:5,background:sel?"#c0392b":esHoy?"#c0392b22":evs.length?col+"15":"transparent",border:sel?"1px solid #c0392b":esHoy?"1px solid #c0392b55":evs.length?`1px solid ${col}33`:"1px solid transparent",cursor:evs.length?"pointer":"default",position:"relative"}}>
            <span style={{fontSize:10,color:sel?"#fff":esHoy?"#c0392b":evs.length?"#f0e6d0":"#444",fontWeight:esHoy||evs.length?600:400}}>{d}</span>
            {evs.length>0&&!sel&&<div style={{position:"absolute",bottom:1,right:1,background:col,color:"#fff",borderRadius:5,padding:"0 3px",fontSize:7,fontWeight:700,lineHeight:1.4}}>{evs.length}</div>}
          </div>;
        })}
      </div>
    </div>
    {diaSelec&&evsDia.length>0&&<div>
      <div style={{color:"#c9a96e",fontSize:11,fontWeight:600,marginBottom:10,letterSpacing:"0.05em",textTransform:"uppercase"}}>{evsDia.length} evento{evsDia.length!==1?"s":""} · {new Date(diaSelec+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})}</div>
      {evsDia.map(ev=><EventoCard key={ev.num} ev={ev} onClick={onEventoClick} onQuickEdit={onQuickEdit}/>)}
    </div>}
    {!diaSelec&&<div>
      <div style={{color:"#f0e6d0",fontFamily:"'Playfair Display',serif",fontSize:14,fontWeight:600,marginBottom:10}}>Próximos 30 días</div>
      {eventos.filter(e=>{const d=diasHasta(e.fecha);return d>=0&&d<=30;}).sort((a,b)=>a.fecha.localeCompare(b.fecha)).map((ev,i)=><div key={i} onClick={()=>onEventoClick(ev)} style={{display:"flex",gap:12,alignItems:"center",padding:"10px 12px",background:"#141414",borderRadius:9,marginBottom:6,cursor:"pointer",border:"1px solid #2a2a2a"}}>
        <div style={{width:36,textAlign:"center",flexShrink:0,background:"#1e1e1e",borderRadius:7,padding:"4px 3px"}}>
          <div style={{fontSize:15,fontWeight:900,color:"#c0392b",fontFamily:"'Playfair Display',serif",lineHeight:1}}>{parseDate(ev.fecha).getDate()}</div>
          <div style={{fontSize:8,color:"#666",textTransform:"uppercase",letterSpacing:1}}>{["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"][parseDate(ev.fecha).getMonth()]}</div>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:13,fontWeight:500,color:"#f0e6d0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{ev.cliente}</div>
          <div style={{fontSize:10,color:"#666",marginTop:1}}>{ev.turno} · {ev.tipo}</div>
        </div>
        {ev.cortador
          ? <span style={{fontSize:10,color:colorCortador(ev.cortador),background:colorCortador(ev.cortador)+"18",borderRadius:10,padding:"2px 8px",flexShrink:0}}>{ev.cortador}</span>
          : <span style={{fontSize:10,color:"#f87171",flexShrink:0}}>Sin cortador</span>
        }
      </div>)}
    </div>}
  </div>;
}

function ArtDCorteApp() {
  const [data,setData]=useState({eventos:[],cortadores:[],clientes:[],stats:null});
  const [loading,setLoading]=useState(true);
  const [loadErr,setLoadErr]=useState("");
  const [tab,setTab]=useState("resumen");
  const [vista,setVista]=useState("list");
  const [eventoActivo,setEventoActivo]=useState(null);
  const [panelRapido,setPanelRapido]=useState(null);
  const [toast,setToast]=useState(null);

  function showToast(msg,color="#4ade80") { setToast({msg,color}); setTimeout(()=>setToast(null),2800); }

  const cargarDatos=useCallback(async()=>{
    setLoading(true); setLoadErr("");
    try {
      const res=await apiGet();
      if(res.error) throw new Error(res.mensaje);
      setData({eventos:res.eventos||[],cortadores:res.cortadores||[],clientes:res.clientes||[],stats:res.stats||null});
    } catch(e) { setLoadErr("No se pudo conectar: "+e.message); }
    setLoading(false);
  },[]);

  useEffect(()=>{
    cargarDatos();
    const onVis=()=>{if(document.visibilityState==="visible")cargarDatos();};
    document.addEventListener("visibilitychange",onVis);
    return ()=>document.removeEventListener("visibilitychange",onVis);
  },[cargarDatos]);

  function handleEventoClick(ev) { setEventoActivo(ev); setVista("editar"); }
  function handleQuickEdit(ev,campo) { setPanelRapido({ev,campo}); }
  function handleSaved(updated) {
    setData(prev=>({...prev,eventos:prev.eventos.map(e=>e.num===updated.num?{...e,...updated}:e)}));
    showToast("✅ Guardado en Sheet"); setVista("list");
  }
  function handleQuickSaved(updated) {
    setData(prev=>({...prev,eventos:prev.eventos.map(e=>e.num===updated.num?{...e,...updated}:e)}));
    setPanelRapido(null); showToast("✅ Guardado");
  }
  function handleDeleted(num) {
    setData(prev=>({...prev,eventos:prev.eventos.map(e=>e.num===num?{...e,estado:"Cancelado"}:e)}));
    showToast("✅ Cancelado","#fbbf24"); setVista("list");

          <span style={{fontSize:9,letterSpacing:"0.02em"}}>{t.l}</span>
        </button>)}
      </div>
    </div>}

    {loadErr&&<div style={{margin:"14px 16px 0",background:"#1e0a0a",border:"1px solid #f87171",borderRadius:9,padding:"10px 12px",color:"#f87171",fontSize:12}}>
      ⚠️ {loadErr} <button onClick={cargarDatos} style={{marginLeft:10,background:"none",border:"1px solid #f87171",color:"#f87171",borderRadius:6,padding:"3px 8px",cursor:"pointer",fontSize:11,fontFamily:"inherit"}}>Reintentar</button>
    </div>}

    <div style={{flex:1,overflowY:"auto"}}>
      {vista==="editar"&&eventoActivo&&<FormEvento ev={eventoActivo} cortadores={data.cortadores} clientes={data.clientes||[]} onBack={()=>setVista("list")} onSaved={handleSaved} onDeleted={handleDeleted}/>}
      {vista==="nuevo"&&<FormEvento isNew cortadores={data.cortadores} clientes={data.clientes||[]} onBack={()=>setVista("list")} onCreate={handleCreated}/>}
      {vista==="list"&&tab==="resumen"&&<TabResumen eventos={data.eventos} stats={data.stats} onVerTodos={()=>setTab("eventos")} onEventoClick={handleEventoClick} onQuickEdit={handleQuickEdit} loading={loading}/>}
      {vista==="list"&&tab==="eventos"&&<TabEventos eventos={data.eventos} onEventoClick={handleEventoClick} onQuickEdit={handleQuickEdit} loading={loading}/>}
      {vista==="list"&&tab==="equipo"&&<TabEquipo cortadores={data.cortadores} eventos={data.eventos} onEventoClick={handleEventoClick} onQuickEdit={handleQuickEdit} loading={loading}/>}
      {vista==="list"&&tab==="calendario"&&<TabCalendario eventos={data.eventos} onEventoClick={handleEventoClick} onQuickEdit={handleQuickEdit} loading={loading}/>}
    </div>

    {panelRapido&&<PanelRapido ev={panelRapido.ev} campo={panelRapido.campo} cortadores={data.cortadores} onClose={()=>setPanelRapido(null)} onSaved={handleQuickSaved}/>}

    {toast&&<div style={{position:"absolute",bottom:20,left:"50%",transform:"translateX(-50%)",background:"#1e1e1e",border:`1px solid ${toast.color}33`,borderRadius:10,padding:"9px 16px",color:toast.color,fontSize:12,fontWeight:600,whiteSpace:"nowrap",zIndex:200,boxShadow:"0 4px 20px rgba(0,0,0,0.6)"}}>{toast.msg}</div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<ArtDCorteApp/>);

  </script>
  <script>
    if("serviceWorker" in navigator) {
      window.addEventListener("load",()=>{
        navigator.serviceWorker.register("service-worker.js")
          .then(reg=>{
            reg.addEventListener("updatefound",()=>{
              const nw=reg.installing;
              if(!nw) return;
              nw.addEventListener("statechange",()=>{
                if(nw.state==="installed"&&navigator.serviceWorker.controller) nw.postMessage({type:"SKIP_WAITING"});
              });
            });
          }).catch(e=>console.warn("SW:",e));
        let refreshing=false;
        navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!refreshing){refreshing=true;window.location.reload();}});
      });
    }
  </script>
</body>
</html>
