const HOY = new Date(); HOY.setHours(0,0,0,0);

const COLORES = {
  "Jorge":"#C0392B","Pablo":"#8B4513","Iván":"#D4A820","Álvaro":"#2C5F2E",
  "Borja":"#1A3A5C","Manuel":"#6D2B8F","Carlos":"#E67E22","Javier":"#16A085",
  "Juan":"#8E44AD","Martín":"#795548","Demetrio":"#607D8B","Enrique":"#E91E63",
  "Adrián":"#C0392B","David":"#2980B9","Miguel":"#27AE60",
};
function colorCortador(nombre) {
  if (!nombre) return "#9E9E9E";
  const k = Object.keys(COLORES).find(k => nombre.toLowerCase().includes(k.toLowerCase()));
  return k ? COLORES[k] : "#8B7355";
}
function esSemana(fecha) {
  const lun = new Date(HOY); lun.setDate(HOY.getDate()-((HOY.getDay()+6)%7));
  const dom = new Date(lun); dom.setDate(lun.getDate()+6); dom.setHours(23,59,59);
  return fecha>=lun && fecha<=dom;
}
function diasHasta(f) {
  const d = Math.ceil((f-HOY)/86400000);
  if(d===0) return "Hoy"; if(d===1) return "Mañana"; if(d<0) return `Hace ${Math.abs(d)}d`; return `${d}d`;
}
const fmtCorto = d => d.toLocaleDateString("es-ES",{day:"2-digit",month:"short"});
const fmtFecha = d => d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric"});
const fmtLargo = d => d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const ESTADO_COLOR = {Confirmado:"#27AE60",Pendiente:"#F39C12",Cancelado:"#E74C3C",Realizado:"#7F8C8D"};
const TIPO_COLOR   = {Boda:"#C0392B",Feria:"#8B4513","Inauguración":"#D4A820",Corporativo:"#1A3A5C",Evento:"#2980B9","Cóctel":"#8E44AD"};

// Extraer cortadores de un string (soporta separadores , / +)
function parseCortadores(str) {
  if (!str) return [];
  return str.split(/,|\/|\+/).map(c=>c.trim()).filter(Boolean);
}

// Comprobar si un cortador está asignado a un evento (busca coincidencia parcial)
function cortadorEnEvento(nombreCortador, evCortador) {
  if (!evCortador || !nombreCortador) return false;
  const cortadores = parseCortadores(evCortador);
  const target = nombreCortador.toLowerCase().trim();
  return cortadores.some(c => c.toLowerCase().includes(target) || target.includes(c.toLowerCase()));
}

const Badge = ({text,color,small=false}) => (
  <span style={{
    display:"inline-block",padding:small?"1px 7px":"2px 10px",borderRadius:20,
    fontSize:small?10:11,fontWeight:600,letterSpacing:"0.5px",textTransform:"uppercase",
    background:color+"22",color,border:`1px solid ${color}44`,whiteSpace:"nowrap",
  }}>{text}</span>
);

const CortadorPill = ({nombre,small=false}) => {
  if (!nombre) return <span style={{color:"#AAA",fontSize:11,fontStyle:"italic"}}>Sin asignar</span>;
  const color = colorCortador(nombre);
  return (
    <span style={{
      display:"inline-flex",alignItems:"center",gap:4,
      background:color+"18",border:`1px solid ${color}44`,
      borderRadius:20,padding:small?"1px 8px":"3px 10px",
      fontSize:small?10:12,color,whiteSpace:"nowrap",
    }}>
      <span style={{width:5,height:5,borderRadius:"50%",background:color,display:"inline-block",flexShrink:0}}/>
      {nombre}
    </span>
  );
};

const StatCard = ({label,value,sub,accent,alert=false}) => (
  <div style={{
    background:"#1A1008",border:`1px solid ${alert?"#E74C3C44":"#3A2810"}`,
    borderRadius:14,padding:"16px",position:"relative",overflow:"hidden",
    flex:"1 1 130px",minWidth:0,
  }}>
    <div style={{position:"absolute",top:0,left:0,right:0,height:3,background:accent}}/>
    <div style={{fontSize:10,color:"#8A7060",letterSpacing:2,textTransform:"uppercase",marginBottom:6}}>{label}</div>
    <div style={{fontSize:34,fontWeight:900,color:"#F5ECD8",fontFamily:"'Playfair Display',serif",lineHeight:1}}>{value}</div>
    {sub && <div style={{fontSize:11,color:alert?"#E74C3C":"#8A7060",marginTop:4}}>{sub}</div>}
  </div>
);

function EventoCard({ev,onClick,selected,compacto=false}) {
  const color = colorCortador(ev.cortador);
  const semana = esSemana(ev.fecha);
  const cortadores = parseCortadores(ev.cortador);
  return (
    <div onClick={()=>onClick(ev)} style={{
      background:selected?"#2A1808":"#1A1008",
      border:`1px solid ${selected?"#C0392B":"#2A1A0A"}`,
      borderRadius:14,padding: compacto ? "12px 14px" : "14px 16px", cursor:"pointer",
      borderLeft:`3px solid ${semana?"#D4A820":color}`,
    }}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
        <div style={{flex:1,minWidth:0,paddingRight:8}}>
          <div style={{fontSize:compacto?13:14,fontWeight:600,color:"#F5ECD8",lineHeight:1.3,marginBottom:3}}>{ev.cliente}</div>
          <div style={{fontSize:11,color:"#8A7060"}}>
            {fmtCorto(ev.fecha)} · {ev.turno}{ev.jamones>0?` · 🐷 ${ev.jamones}`:""}
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4,flexShrink:0}}>
          <Badge text={ev.estado} color={ESTADO_COLOR[ev.estado]||"#999"} small/>
          {semana && <span style={{fontSize:9,color:"#D4A820",border:"1px solid #D4A82044",borderRadius:4,padding:"1px 5px",whiteSpace:"nowrap"}}>● Semana</span>}
        </div>
      </div>
      <div style={{display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}}>
        <Badge text={ev.tipo||"Evento"} color={TIPO_COLOR[ev.tipo]||"#2980B9"} small/>
        {cortadores.length>0
          ? cortadores.map((c,i)=><CortadorPill key={i} nombre={c} small/>)
          : <CortadorPill nombre="" small/>
        }
      </div>
    </div>
  );
}

function EventoDetalle({ev,onClose}) {
  if (!ev) return null;
  const cortadores = parseCortadores(ev.cortador);
  const tieneObs = ev.obs && ev.obs.trim();
  return (

// Calendario con click en día
function CalMini({eventos, diaSeleccionado, setDiaSeleccionado}) {
  const [mes,setMes] = useState(new Date().getMonth());
  const [año,setAño] = useState(new Date().getFullYear());
  const offset = (new Date(año,mes,1).getDay()+6)%7;
  const dias = new Date(año,mes+1,0).getDate();
  const meses=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

  const evMes={};
  eventos.forEach(ev=>{
    if(ev.fecha instanceof Date && ev.fecha.getMonth()===mes && ev.fecha.getFullYear()===año){
      const d=ev.fecha.getDate();
      if(!evMes[d]) evMes[d]=[];
      evMes[d].push(ev);
    }
  });

  const hoyDia=new Date().getDate();
  const hoyMes=new Date().getMonth();
  const hoyAño=new Date().getFullYear();

  const cambiarMes = (delta) => {
    let nuevoMes = mes + delta;
    let nuevoAño = año;
    if (nuevoMes < 0) { nuevoMes = 11; nuevoAño--; }
    if (nuevoMes > 11) { nuevoMes = 0; nuevoAño++; }
    setMes(nuevoMes);
    setAño(nuevoAño);
    setDiaSeleccionado(null);
  };

  const handleClickDia = (d) => {
    const evs = evMes[d] || [];
    if (evs.length === 0) {
      setDiaSeleccionado(null);
      return;
    }
    const key = `${año}-${String(mes+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    setDiaSeleccionado(diaSeleccionado === key ? null : key);
  };

  return (
    <div style={{background:"#1A1008",border:"1px solid #3A2810",borderRadius:16,padding:"20px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <button onClick={()=>cambiarMes(-1)} style={{background:"none",border:"none",color:"#8A7060",cursor:"pointer",fontSize:22,padding:"0 12px",lineHeight:1}}>‹</button>
        <span style={{fontFamily:"'Playfair Display',serif",fontSize:17,fontWeight:700,color:"#F5ECD8"}}>{meses[mes]} {año}</span>
        <button onClick={()=>cambiarMes(1)} style={{background:"none",border:"none",color:"#8A7060",cursor:"pointer",fontSize:22,padding:"0 12px",lineHeight:1}}>›</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:6}}>
        {["L","M","X","J","V","S","D"].map(d=><div key={d} style={{textAlign:"center",fontSize:9,color:"#5A4A3A",letterSpacing:1}}>{d}</div>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
        {Array(offset).fill(null).map((_,i)=><div key={"e"+i}/>)}
        {Array(dias).fill(null).map((_,i)=>{
          const d=i+1;
          const evs=evMes[d]||[];
          const esHoy=d===hoyDia&&mes===hoyMes&&año===hoyAño;
          const col=evs.length?colorCortador(evs[0].cortador):null;
          const key = `${año}-${String(mes+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
          const seleccionado = diaSeleccionado === key;
          const tieneEvs = evs.length > 0;
          return (
            <div
              key={d}
              onClick={() => handleClickDia(d)}
              style={{
                aspectRatio:"1",display:"flex",flexDirection:"column",
                alignItems:"center",justifyContent:"center",borderRadius:7,
                background: seleccionado ? "#C0392B" : esHoy ? "#C0392B22" : evs.length ? col+"15" : "transparent",
                border: seleccionado ? "1px solid #C0392B" : esHoy ? "1px solid #C0392B55" : evs.length ? `1px solid ${col}33` : "1px solid transparent",
                cursor: tieneEvs ? "pointer" : "default",
                position: "relative",
              }}
            >
              <span style={{
                fontSize:11,
                color: seleccionado ? "#FFF" : esHoy ? "#C0392B" : evs.length ? "#F5ECD8" : "#5A4A3A",
                fontWeight:esHoy||evs.length?600:400
              }}>{d}</span>
              {evs.length>0 && !seleccionado && (
                <div style={{
                  position:"absolute", bottom:3, right:3,
                  background:col, color:"#FFF",
                  borderRadius:8, padding:"0 4px",
                  fontSize:8, fontWeight:700, minWidth:12, textAlign:"center",
                  lineHeight:1.4,
                }}>{evs.length}</div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// Lista de eventos de un día concreto (debajo del calendario)
function EventosDelDia({diaSeleccionado, eventos, onClickEvento}) {
  if (!diaSeleccionado) return null;

  const [año,mes,dia] = diaSeleccionado.split("-").map(Number);
  const evs = eventos.filter(e =>
    e.fecha.getFullYear() === año &&
    e.fecha.getMonth() === mes - 1 &&
    e.fecha.getDate() === dia
  ).sort((a,b) => (a.turno||"").localeCompare(b.turno||""));

  if (evs.length === 0) return null;

  const fechaObj = new Date(año, mes-1, dia);

  return (
    <div style={{marginTop:16}} className="slide-up">
      <div style={{
        display:"flex", alignItems:"center", gap:10, marginBottom:12,
        paddingBottom:10, borderBottom:"1px solid #2A1A0A",
      }}>
        <div style={{
          width:42, height:42, borderRadius:10,
          background:"#C0392B", color:"#FFF",
          display:"flex", flexDirection:"column",
          alignItems:"center", justifyContent:"center",
          fontFamily:"'Playfair Display',serif",
        }}>
          <div style={{fontSize:16, fontWeight:900, lineHeight:1}}>{dia}</div>
          <div style={{fontSize:8, textTransform:"uppercase", letterSpacing:1, opacity:0.8}}>
            {["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"][mes-1]}
          </div>
        </div>
        <div>
          <div style={{fontSize:14, color:"#F5ECD8", fontFamily:"'Playfair Display',serif",fontWeight:700, textTransform:"capitalize"}}>
            {fechaObj.toLocaleDateString("es-ES",{weekday:"long"})}
          </div>
          <div style={{fontSize:11,color:"#8A7060"}}>{evs.length} evento{evs.length!==1?"s":""}</div>
        </div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {evs.map(ev => (
          <EventoCard key={ev.num} ev={ev} onClick={onClickEvento} compacto/>
        ))}
      </div>
    </div>
  );
}

// Card cortador con expansión de eventos
function CortadorCard({cortador, eventos, expandido, onToggle, onClickEvento}) {
  const col = cortador.color || colorCortador(cortador.nombre);

  // Filtrar eventos del cortador (próximos)
  const eventosCortador = eventos
    .filter(e => cortadorEnEvento(cortador.nombre, e.cortador) && e.fecha >= HOY)
    .sort((a,b) => a.fecha - b.fecha);

  return (
    <div style={{
      background:"#1A1008", border:`1px solid ${expandido ? col+"66" : "#3A2810"}`,
      borderRadius:12, borderTop:`3px solid ${col}`,
      gridColumn: expandido ? "1 / -1" : "auto",
      transition:"grid-column 0.2s",
    }}>
      <div
        onClick={onToggle}
        style={{padding:"14px 12px", cursor:"pointer"}}
      >
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontFamily:"'Playfair Display',serif",fontSize:15,fontWeight:700,color:"#F5ECD8"}}>{cortador.nombre}</div>
            <div style={{fontSize:10,color:cortador.tieneTablero?"#27AE60":"#E74C3C",marginTop:3}}>
              {cortador.tieneTablero?"● Trello":"○ Sin tablero"}
            </div>
            <div style={{fontSize:11,color:"#8A7060",marginTop:6}}>
              {eventosCortador.length} evento{eventosCortador.length!==1?"s":""} próximo{eventosCortador.length!==1?"s":""}
            </div>
          </div>
          <div style={{width:32,height:32,borderRadius:"50%",background:col+"22",border:`2px solid ${col}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,color:col}}>
            {cortador.nombre[0]}
          </div>
        </div>
      </div>

      {/* Panel expandido con eventos */}
      {expandido && (
        <div className="slide-up" style={{
          padding:"4px 12px 14px",
          borderTop:`1px solid #2A1A0A`,
        }}>
          {eventosCortador.length === 0 ? (
            <div style={{padding:"16px 0",textAlign:"center",color:"#5A4A3A",fontSize:12}}>
              Sin eventos próximos asignados
            </div>
          ) : (
            <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:10}}>
              {eventosCortador.map(ev=>(
                <EventoCard key={ev.num} ev={ev} onClick={onClickEvento} compacto/>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function App() {
  const [tab,setTab]             = useState("eventos");
  const [filtro,setFiltro]       = useState("proximos");
  const [busqueda,setBusqueda]   = useState("");
  const [eventoSel,setEventoSel] = useState(null);
  const [cortadorExp,setCortadorExp] = useState(null);
  const [diaSeleccionado,setDiaSeleccionado] = useState(null);
  const [isMobile,setIsMobile]   = useState(window.innerWidth < 768);
  const [eventos,setEventos]     = useState([]);
  const [cortadores,setCortadores] = useState([]);
  const [statsApi,setStatsApi]   = useState(null);
  const [cargando,setCargando]   = useState(true);
  const [errorMsg,setErrorMsg]   = useState(null);
  const [ultimaSync,setUltimaSync] = useState(null);

  useEffect(()=>{
    const fn=()=>setIsMobile(window.innerWidth<768);
    window.addEventListener("resize",fn);
    return ()=>window.removeEventListener("resize",fn);
  },[]);

  const hideSplash = () => {
    const s=document.getElementById("splash");
    if(s){s.style.opacity="0";setTimeout(()=>s.remove(),400);}
  };

  const cargarDatos = () => {
    setCargando(true); setErrorMsg(null);
    fetch(WEB_APP_URL)
      .then(r=>r.json())
      .then(data=>{
        if(data.error) throw new Error(data.mensaje);
        setEventos(data.eventos.map(ev=>Object.assign({},ev,{fecha:new Date(ev.fecha+"T00:00:00")})));
        setCortadores(data.cortadores||[]);
        setStatsApi(data.stats);
        setUltimaSync(new Date());
        hideSplash();
      })
      .catch(err=>{setErrorMsg(err.message);hideSplash();})
      .finally(()=>setCargando(false));
  };

  useEffect(()=>{
    cargarDatos();
    // Refrescar automáticamente cuando la app vuelve al primer plano
    // (cambiar de app, bloquear/desbloquear móvil, volver a la PWA, etc.)
    const onVisible = () => {
      if (document.visibilityState === 'visible') {
        cargarDatos();
      }
    };
    document.addEventListener('visibilitychange', onVisible);
    return () => document.removeEventListener('visibilitychange', onVisible);
  },[]);

  const stats = statsApi
    ? {semana:statsApi.proximosSemana,sinCort:statsApi.sinCortador,mes:statsApi.totalMes,jamones:statsApi.jamonesMes}
    : {semana:0,sinCort:0,mes:0,jamones:0};

  const filtrados = eventos.filter(ev=>{
    if(busqueda){
      const q=busqueda.toLowerCase();
      if(!ev.cliente.toLowerCase().includes(q)&&!(ev.cortador||"").toLowerCase().includes(q)&&!(ev.tipo||"").toLowerCase().includes(q)) return false;
    }
    if(filtro==="proximos") return ev.fecha>=HOY&&ev.estado!=="Realizado";
    if(filtro==="semana")   return esSemana(ev.fecha);
    if(filtro==="sin")      return !ev.cortador&&ev.fecha>=HOY;
    return true;
  }).sort((a,b)=>a.fecha-b.fecha);

  const TABS=[{id:"eventos",icon:"📋",label:"Eventos"},{id:"cortadores",icon:"🔪",label:"Equipo"},{id:"calendario",icon:"📅",label:"Calendario"}];

  return (
    <div style={{minHeight:"100vh",background:"#0D0905",color:"#F5ECD8",display:"flex",flexDirection:"column"}}>
      <header style={{background:"#110C06",borderBottom:"1px solid #2A1A0A",padding:isMobile?"0 16px":"0 32px",position:"sticky",top:0,zIndex:100,paddingTop:"env(safe-area-inset-top,0px)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",height:isMobile?56:64}}>
          <img src={LOGO_SRC} alt="Art D'Corte" style={{height:isMobile?40:50,width:"auto",objectFit:"contain"}}/>
          {!isMobile && (
            <nav style={{display:"flex",gap:4}}>
              {TABS.map(({id,icon,label})=>(
                <button key={id} onClick={()=>setTab(id)} style={{background:tab===id?"#C0392B11":"none",border:"none",borderBottom:tab===id?"2px solid #C0392B":"2px solid transparent",color:tab===id?"#C0392B":"#8A7060",padding:"0 18px",height:64,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",fontSize:13,fontWeight:tab===id?600:400,display:"flex",alignItems:"center",gap:6}}>
                  {icon} {label}
                </button>
              ))}
            </nav>
          )}
          <div style={{textAlign:"right",fontSize:10,color:"#5A4A3A",lineHeight:1.6}}>
            <div>{new Date().toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"})}</div>
            {ultimaSync&&<div style={{color:"#3A2810"}}>sync {ultimaSync.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})}</div>}
            <button onClick={cargarDatos} disabled={cargando} style={{
              background: cargando ? "#3A2810" : "#1A1008",
              border: "1px solid #3A2810",
              color: cargando ? "#5A4A3A" : "#D4A820",
              cursor: cargando ? "wait" : "pointer",
              fontSize: 11, padding: "4px 10px", borderRadius: 6,
              fontFamily: "'DM Sans', sans-serif",
              fontWeight: 500, marginTop: 4,
              display: "inline-flex", alignItems: "center", gap: 4,
            }}>
              <span style={{display:"inline-block", animation: cargando ? "spin 0.8s linear infinite" : "none"}}>↻</span>
              {cargando ? "..." : "Actualizar"}
            </button>
          </div>
        </div>
      </header>

      <main style={{flex:1,padding:isMobile?"16px 12px 80px":"28px 32px 32px",overflowY:"auto"}}>
        {cargando&&(
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:12,padding:"64px",color:"#8A7060"}}>

                  </div>
                )}
                <div style={{display:"grid",gridTemplateColumns:isMobile?"repeat(2,1fr)":"repeat(auto-fill,minmax(180px,1fr))",gap:10,alignItems:"start"}}>
                  {cortadores.map((c,i)=>(
                    <CortadorCard
                      key={i}
                      cortador={c}
                      eventos={eventos}
                      expandido={cortadorExp === c.nombre}
                      onToggle={() => setCortadorExp(cortadorExp === c.nombre ? null : c.nombre)}
                      onClickEvento={ev => setEventoSel(ev)}
                    />
                  ))}
                </div>
              </div>
            )}

            {tab==="calendario"&&(
              <div className="slide-up">
                <CalMini
                  eventos={eventos}
                  diaSeleccionado={diaSeleccionado}
                  setDiaSeleccionado={setDiaSeleccionado}
                />
                <EventosDelDia
                  diaSeleccionado={diaSeleccionado}
                  eventos={eventos}
                  onClickEvento={ev => setEventoSel(ev)}
                />
                {!diaSeleccionado && (
                  <div style={{marginTop:16}}>
                    <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:17,color:"#F5ECD8",marginBottom:12}}>Próximos 30 días</h3>
                    <div style={{background:"#110C06",border:"1px solid #2A1A0A",borderRadius:14,overflow:"hidden"}}>
                      {eventos.filter(e=>e.fecha>=HOY&&(e.fecha-HOY)<30*86400000).sort((a,b)=>a.fecha-b.fecha).map((ev,i)=>(
                        <div key={i} onClick={() => setEventoSel(ev)} style={{display:"flex",gap:12,alignItems:"center",padding:"13px 16px",borderBottom:"1px solid #1A1008",cursor:"pointer"}}>
                          <div style={{width:42,textAlign:"center",flexShrink:0,background:"#1A1008",borderRadius:8,padding:"6px 4px"}}>
                            <div style={{fontSize:17,fontWeight:900,color:"#C0392B",fontFamily:"'Playfair Display',serif",lineHeight:1}}>{ev.fecha.getDate()}</div>
                            <div style={{fontSize:8,color:"#8A7060",textTransform:"uppercase",letterSpacing:1}}>{["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"][ev.fecha.getMonth()]}</div>
                          </div>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{fontSize:13,fontWeight:500,color:"#F5ECD8",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{ev.cliente}</div>
                            <div style={{fontSize:10,color:"#8A7060",marginTop:1}}>{ev.turno} · {ev.tipo}</div>
                          </div>
                          <CortadorPill nombre={ev.cortador} small/>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}
          </React.Fragment>
        )}
      </main>

      {isMobile&&(
        <nav style={{position:"fixed",bottom:0,left:0,right:0,background:"#110C06",borderTop:"1px solid #2A1A0A",display:"flex",zIndex:100,paddingBottom:"env(safe-area-inset-bottom,0px)"}}>
          {TABS.map(({id,icon,label})=>(
            <button key={id} onClick={()=>setTab(id)} style={{flex:1,background:"none",border:"none",color:tab===id?"#C0392B":"#5A4A3A",padding:"10px 0 8px",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
              <span style={{fontSize:20}}>{icon}</span>
              <span style={{fontSize:9,fontWeight:tab===id?600:400,letterSpacing:0.5}}>{label.toUpperCase()}</span>
              {tab===id&&<div style={{width:16,height:2,background:"#C0392B",borderRadius:1}}/>}
            </button>
          ))}
        </nav>
      )}
      {eventoSel&&<EventoDetalle ev={eventoSel} onClose={()=>setEventoSel(null)}/>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>

  <script>
    // Registrar service worker (necesario para que Chrome reconozca la app como PWA instalable)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').then(reg => {
          // Detectar actualización del SW
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', () => {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                // Hay una versión nueva esperando - activarla y recargar
                nw.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
        }).catch(err => console.warn('SW err:', err));
        // Cuando el nuevo SW toma el control, recargar para usar la versión nueva
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      });
    }
  </script>
</body>
